name: Offline MCP contract smoke example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fictional test suite
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: Verify one PASS and one expected FAIL (fully offline)
        run: node examples/offline-ci-check.mjs
